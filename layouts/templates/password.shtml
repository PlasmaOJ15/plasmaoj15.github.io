<html>
	<head id="head">
		<meta charset="utf-8">
		<meta name="viewport" content="initial-scale=1">
		<title :text="$site.title"></title>
		<link type="text/css" rel="stylesheet" href="$site.asset('styleVOID.css').link()">
		<link type="text/css" rel="stylesheet" href="$site.asset('highlight.css').link()">
		<!-- mathtex -->

		<script defer src="$site.asset('temml.min.js').link()"></script>
		<script defer src="$site.asset('render-mathtex.js').link()"></script>
		<title>Login page</title>
		<super>
	</head>
	<body id="body">
		<!--I stole this code from here so thank you 
		https://stackoverflow.com/questions/72737210/how-do-i-make-a-simple-password-page-with-multiple-passwords-->
		<form>
			<input id="pswd">
			<input type="button"
			       value="Submit"
			       onclick="checkPswd();"
			>
		</form>
		<script type="text/javascript">

			const passwords = [
				{
					pass: "hello",
					page: "../hello.txt"
				},
				{
					pass: "test",
					page: "../test"
				},
				{
					<--
					pass: "sourcecode",
					page: "../uoYkcuF"
				}
			];

			function checkPswd() {
				const passInput = document.getElementById("pswd").value;
				const passMatch = passwords.find(o => o.pass === passInput);

				if (passMatch ) {
					console.log(`Redirecting to: "${passMatch.page}"`);
					window.location = `${passMatch.page}`;
				} else {
					alert("Passwords do not match.");
				}
			}
		</script>
		<super>
	</body>
</html>
